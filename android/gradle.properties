org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Must stay false: flutter_background_service applies the kotlin-android
# plugin, which AGP 9 rejects when built-in Kotlin is enabled. file_picker is
# pinned to 10.x because 11+ requires built-in Kotlin under AGP 9.
android.builtInKotlin=false
# Kotlin incremental compilation breaks when the pub cache (C:) and this
# project (D:) are on different drives ("this and base files have different
# roots"), corrupting plugin build caches. Disable it.
kotlin.incremental=false
